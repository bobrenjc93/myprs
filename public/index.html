<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My PRs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      padding: 24px;
      padding-bottom: 80px;
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 { font-size: 24px; font-weight: 600; }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }

    .btn:hover { background: #30363d; }
    .btn.active { background: #1f6feb; border-color: #1f6feb; }

    .stats { font-size: 13px; color: #8b949e; }

    .repo-group {
      margin-bottom: 20px;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
    }

    .repo-header {
      background: #161b22;
      padding: 12px 16px;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .repo-header:hover { background: #1c2128; }

    .repo-header a { color: #58a6ff; text-decoration: none; }
    .repo-header a:hover { text-decoration: underline; }

    .repo-count {
      background: #30363d;
      color: #8b949e;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
    }

    .pr-list { list-style: none; }

    .pr-item {
      padding: 10px 16px;
      border-top: 1px solid #21262d;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: default;
    }

    .pr-item:hover { background: #161b22; }
    .pr-item.selected { background: #1a2332; }

    .pr-checkbox {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      margin-top: 3px;
      accent-color: #1f6feb;
      cursor: pointer;
    }

    .pr-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin-top: 2px;
    }

    .pr-icon.open { color: #3fb950; }
    .pr-icon.draft { color: #8b949e; }

    .pr-body { flex: 1; min-width: 0; }

    .pr-title-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pr-title {
      color: #e6edf3;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
    }

    .pr-title:hover { color: #58a6ff; text-decoration: underline; }

    .pr-number { color: #8b949e; font-size: 13px; }

    .draft-badge {
      background: #30363d;
      color: #8b949e;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }

    .approved-badge {
      background: rgba(63, 185, 80, 0.2);
      color: #3fb950;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }

    .changes-requested-badge {
      background: rgba(248, 81, 73, 0.2);
      color: #f85149;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }

    .ci-fail-badge {
      background: #f85149;
      color: #0d1117;
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .stale-badge {
      background: rgba(210, 153, 34, 0.2);
      color: #d29922;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }

    .no-reviewers-badge {
      background: rgba(163, 113, 247, 0.2);
      color: #a371f7;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }

    .attention-banner {
      background: rgba(248, 81, 73, 0.15);
      border: 1px solid #f85149;
      color: #f85149;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .auth-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: rgba(210, 153, 34, 0.15);
      border: 1px solid #d29922;
      color: #e3b341;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .auth-banner code {
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 13px;
    }

    .verify-btn {
      background: #d29922;
      border: none;
      color: #0d1117;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .verify-btn:hover { background: #e3b341; }
    .verify-btn:disabled { opacity: 0.6; cursor: default; }

    .sleep-badge {
      background: rgba(210, 153, 34, 0.2);
      color: #d29922;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }

    .label {
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
      border: 1px solid transparent;
    }

    .pr-meta {
      font-size: 12px;
      color: #8b949e;
      margin-top: 3px;
    }

    .wake-btn {
      background: none;
      border: 1px solid #30363d;
      color: #8b949e;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      margin-left: 8px;
    }

    .wake-btn:hover { background: #21262d; color: #e6edf3; }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #8b949e;
      font-size: 15px;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .refresh-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #161b22;
      border: 1px solid #30363d;
      color: #8b949e;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .refresh-error-banner {
      background: rgba(248, 81, 73, 0.08);
      border: 1px solid rgba(248, 81, 73, 0.4);
      color: #ff7b72;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .spinner-sm {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }

    .error { text-align: center; padding: 40px; color: #f85149; }

    .collapsed .pr-list { display: none; }
    .collapsed .collapse-icon { transform: rotate(-90deg); }

    .collapse-icon {
      transition: transform 0.15s;
      color: #8b949e;
      font-size: 12px;
    }

    .repo-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Selection action bar */
    .action-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #161b22;
      border-top: 1px solid #30363d;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
      transform: translateY(100%);
      transition: transform 0.2s ease;
    }

    .action-bar.visible { transform: translateY(0); }

    .action-bar .count {
      font-size: 14px;
      font-weight: 500;
    }

    .action-bar .sleep-btn {
      background: #d29922;
      border: none;
      color: #0d1117;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .action-bar .sleep-btn:hover { background: #e3b341; }

    .action-bar .wake-sel-btn {
      background: #1f6feb;
      border: none;
      color: #fff;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .action-bar .wake-sel-btn:hover { background: #388bfd; }

    .action-bar .clear-btn {
      background: none;
      border: 1px solid #30363d;
      color: #8b949e;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .action-bar .clear-btn:hover { background: #21262d; color: #e6edf3; }

    .section-label {
      font-size: 13px;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 28px 0 12px;
    }

    .pr-item.sleeping { opacity: 0.6; }

    .pr-item.no-reviewers {
      background: rgba(163, 113, 247, 0.08);
      border-left: 3px solid #a371f7;
    }

    .pr-item.no-reviewers:hover { background: rgba(163, 113, 247, 0.14); }

    /* stale and ci-failing are defined after no-reviewers so they win when a PR is both */
    .pr-item.stale {
      background: rgba(210, 153, 34, 0.08);
      border-left: 3px solid #d29922;
    }

    .pr-item.stale:hover { background: rgba(210, 153, 34, 0.14); }

    /* ci-failing is defined after stale so it wins when a PR is both */
    .pr-item.ci-failing {
      background: rgba(248, 81, 73, 0.08);
      border-left: 3px solid #f85149;
    }

    .pr-item.ci-failing:hover { background: rgba(248, 81, 73, 0.14); }
  </style>
</head>
<body>
  <header>
    <h1>My Pull Requests</h1>
    <div class="controls">
      <span class="stats" id="stats"></span>
      <span class="stats" id="lastRefresh"></span>
      <button class="btn" id="sortBtn" title="Toggle sort order">Oldest first</button>
      <button class="btn active" id="draftToggle">Drafts</button>
      <button class="btn" id="sleepToggle">Sleeping</button>
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>
  </header>
  <main id="app">
    <div class="loading">
      <div class="spinner"></div>
      <div>Fetching PRs...</div>
    </div>
  </main>
  <div class="action-bar" id="actionBar">
    <span class="count" id="selCount"></span>
    <button class="sleep-btn" id="sleepSelectedBtn">Sleep 1 week</button>
    <button class="wake-sel-btn" id="wakeSelectedBtn">Wake</button>
    <button class="clear-btn" id="clearSelBtn">Clear</button>
  </div>

  <script>
    const PR_CACHE_KEY = "myprs_cache_v1";
    const AUTO_REFRESH_MS = 5 * 60 * 1000;

    let allPRs = [];
    let sleepData = {};
    let refreshing = false;
    let refreshError = false;
    let lastRefreshed = null;
    let pingAuthError = false;
    let showDrafts = true;
    let showSleeping = false;
    let oldestFirst = true;
    let selected = new Set();    // set of PR keys
    let lastClickedKey = null;   // for shift-click
    let renderedKeys = [];       // flat ordered list of visible PR keys for shift-select

    const app = document.getElementById("app");
    const draftToggle = document.getElementById("draftToggle");
    const sleepToggle = document.getElementById("sleepToggle");
    const sortBtn = document.getElementById("sortBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const stats = document.getElementById("stats");
    const lastRefreshEl = document.getElementById("lastRefresh");
    const actionBar = document.getElementById("actionBar");
    const selCount = document.getElementById("selCount");
    const sleepSelectedBtn = document.getElementById("sleepSelectedBtn");
    const wakeSelectedBtn = document.getElementById("wakeSelectedBtn");
    const clearSelBtn = document.getElementById("clearSelBtn");

    function prKey(pr) {
      return `${pr.repository.nameWithOwner}#${pr.number}`;
    }

    // A published PR whose pytorch Dr. CI status is not green needs attention.
    function needsAttention(pr) {
      return !pr.isDraft && pr.ciStatus === "red";
    }

    // Count workdays (Mon-Fri) elapsed since the PR was last active, so
    // weekends don't count toward staleness.
    function workdaysSinceActivity(pr) {
      const updated = new Date(pr.updatedAt).getTime();
      const dayMs = 24 * 60 * 60 * 1000;
      const wholeDays = Math.floor((Date.now() - updated) / dayMs);
      let count = 0;
      for (let i = 1; i <= wholeDays; i++) {
        const dow = new Date(updated + i * dayMs).getDay(); // 0 Sun ... 6 Sat
        if (dow !== 0 && dow !== 6) count++;
      }
      return count;
    }

    // A published PR with no activity for 3+ workdays is stale and needs a nudge.
    function isStale(pr) {
      return !pr.isDraft && workdaysSinceActivity(pr) >= 3;
    }

    // A published PR that has no reviewers requested and no reviews yet.
    function noReviewers(pr) {
      return !pr.isDraft && pr.hasReviewers === false;
    }

    function isSleeping(pr) {
      // Approved PRs are always awake, even if a sleep entry lingers.
      if (pr.reviewDecision === "APPROVED") return false;
      const entry = sleepData[prKey(pr)];
      if (!entry) return false;
      return new Date(entry.until).getTime() > Date.now();
    }

    function sleepRemaining(pr) {
      const entry = sleepData[prKey(pr)];
      if (!entry) return "";
      const ms = new Date(entry.until).getTime() - Date.now();
      if (ms <= 0) return "";
      const days = Math.ceil(ms / (24 * 60 * 60 * 1000));
      return `${days}d left`;
    }

    function loadCache() {
      try {
        const raw = localStorage.getItem(PR_CACHE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function saveCache() {
      try {
        localStorage.setItem(PR_CACHE_KEY, JSON.stringify({ prs: allPRs, sleep: sleepData, at: lastRefreshed }));
      } catch {}
    }

    function updateLastRefresh() {
      lastRefreshEl.textContent = lastRefreshed ? `Updated ${timeAgo(lastRefreshed)}` : "";
    }

    async function verifyToken() {
      const btn = document.getElementById("verifyTokenBtn");
      if (btn) { btn.disabled = true; btn.textContent = "Checking…"; }
      try {
        const res = await fetch("/api/verify-token", { method: "POST" });
        const data = await res.json();
        pingAuthError = !!data.authError;
      } catch {
        pingAuthError = true;
      }
      render();
    }

    async function fetchPRs() {
      // Avoid overlapping requests, which can let an older response overwrite
      // a newer one when a manual and automatic refresh happen together.
      if (refreshing) return;

      // Seed from cache so a refresh renders instantly while we fetch fresh data.
      if (allPRs.length === 0) {
        const cache = loadCache();
        if (cache && Array.isArray(cache.prs) && cache.prs.length) {
          allPRs = cache.prs;
          sleepData = cache.sleep || {};
          lastRefreshed = cache.at || null;
        }
      }

      refreshing = true;
      if (allPRs.length > 0) {
        render(); // show cached data with a refreshing spinner on top
      } else {
        app.innerHTML = '<div class="loading"><div class="spinner"></div><div>Fetching PRs...</div></div>';
      }

      try {
        const [prRes, sleepRes, pingRes] = await Promise.all([
          fetch("/api/prs", { cache: "no-store" }),
          fetch("/api/sleep", { cache: "no-store" }),
          fetch("/api/ping-status", { cache: "no-store" }).catch(() => null),
        ]);
        if (!prRes.ok) throw new Error("Failed to fetch PRs");
        allPRs = await prRes.json();
        if (sleepRes.ok) sleepData = await sleepRes.json();
        if (pingRes && pingRes.ok) {
          try { pingAuthError = !!(await pingRes.json()).authError; } catch {}
        }
        lastRefreshed = Date.now();
        refreshError = false;
        saveCache();
        selected.clear();
        updateActionBar();
      } catch (e) {
        refreshError = true;
        if (allPRs.length === 0) {
          refreshing = false;
          app.innerHTML = '<div class="error">Failed to load PRs. Is gh authenticated?</div>';
          return;
        }
        // Otherwise keep showing cached data.
      } finally {
        refreshing = false;
      }
      render();
    }

    async function sleepPRs(keys, days) {
      const res = await fetch("/api/sleep", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ keys, days }),
      });
      sleepData = await res.json();
      saveCache();
      selected.clear();
      updateActionBar();
      render();
    }

    async function wakePR(key) {
      const res = await fetch(`/api/sleep/${encodeURIComponent(key)}`, { method: "DELETE" });
      sleepData = await res.json();
      saveCache();
      render();
    }

    async function wakePRs(keys) {
      // Sequential so the server's read-modify-write of sleep.json doesn't race.
      for (const key of keys) {
        const res = await fetch(`/api/sleep/${encodeURIComponent(key)}`, { method: "DELETE" });
        sleepData = await res.json();
      }
      saveCache();
      selected.clear();
      updateActionBar();
      render();
    }

    function timeAgo(dateStr) {
      const seconds = Math.floor((Date.now() - new Date(dateStr)) / 1000);
      if (seconds < 60) return "just now";
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      if (days < 30) return `${days}d ago`;
      const months = Math.floor(days / 30);
      return `${months}mo ago`;
    }

    function getLabelStyle(label) {
      const hex = label.color;
      const r = parseInt(hex.slice(0, 2), 16);
      const g = parseInt(hex.slice(2, 4), 16);
      const b = parseInt(hex.slice(4, 6), 16);
      return `background: rgba(${r},${g},${b},0.2); color: #${hex}; border-color: rgba(${r},${g},${b},0.4);`;
    }

    function prIcon(isDraft) {
      if (isDraft) {
        return `<svg class="pr-icon draft" viewBox="0 0 16 16" fill="currentColor">
          <path d="M3.5 9.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>
          <path fill-rule="evenodd" d="M3.5 1a.75.75 0 0 1 .75.75v5.5a.75.75 0 0 1-1.5 0v-5.5A.75.75 0 0 1 3.5 1zm9 0a.75.75 0 0 1 .75.75v5.5a.75.75 0 0 1-1.5 0v-5.5A.75.75 0 0 1 12.5 1z"/>
        </svg>`;
      }
      return `<svg class="pr-icon open" viewBox="0 0 16 16" fill="currentColor">
        <path d="M7.177 3.073L9.573.677A.25.25 0 0 1 10 .854v4.792a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354zM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5zm-2.25.75a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25zM11 2.5h-1V4h1a1 1 0 0 1 1 1v5.628a2.251 2.251 0 1 0 1.5 0V5A2.5 2.5 0 0 0 11 2.5zm1 10.25a.75.75 0 1 1 1.5 0 .75.75 0 0 1-1.5 0zM3.75 12a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5z"/>
      </svg>`;
    }

    function escapeHtml(text) {
      const d = document.createElement("div");
      d.textContent = text;
      return d.innerHTML;
    }

    function updateActionBar() {
      const n = selected.size;
      actionBar.classList.toggle("visible", n > 0);
      selCount.textContent = `${n} PR${n === 1 ? '' : 's'} selected`;
    }

    function handleCheckboxClick(key, e) {
      e.stopPropagation();

      if (e.shiftKey && lastClickedKey && lastClickedKey !== key) {
        // Shift-click: select range
        const startIdx = renderedKeys.indexOf(lastClickedKey);
        const endIdx = renderedKeys.indexOf(key);
        if (startIdx !== -1 && endIdx !== -1) {
          const lo = Math.min(startIdx, endIdx);
          const hi = Math.max(startIdx, endIdx);
          for (let i = lo; i <= hi; i++) {
            selected.add(renderedKeys[i]);
          }
        }
      } else {
        if (selected.has(key)) {
          selected.delete(key);
        } else {
          selected.add(key);
        }
      }

      lastClickedKey = key;
      updateActionBar();
      updateCheckboxes();
    }

    function handleRowClick(key, e) {
      // Don't toggle selection when clicking links
      if (e.target.closest('a') || e.target.closest('.wake-btn')) return;
      // Treat row click like checkbox click for selection
      handleCheckboxClick(key, e);
    }

    function updateCheckboxes() {
      document.querySelectorAll('.pr-item[data-key]').forEach(el => {
        const key = el.dataset.key;
        const cb = el.querySelector('.pr-checkbox');
        const isSelected = selected.has(key);
        if (cb) cb.checked = isSelected;
        el.classList.toggle('selected', isSelected);
      });
    }

    function renderGroup(repo, prs, isSleepSection) {
      return `
        <div class="repo-group" data-repo="${repo}">
          <div class="repo-header" onclick="toggleGroup(this)">
            <div class="repo-left">
              <span class="collapse-icon">&#9660;</span>
              <a href="https://github.com/${repo}" target="_blank" onclick="event.stopPropagation()">${repo}</a>
            </div>
            <span class="repo-count">${prs.length}</span>
          </div>
          <ul class="pr-list">
            ${prs.map(pr => {
              const key = prKey(pr);
              const sleeping = isSleeping(pr);
              const ciFailing = needsAttention(pr);
              const stale = isStale(pr);
              const noReview = noReviewers(pr);
              return `
              <li class="pr-item ${selected.has(key) ? 'selected' : ''} ${sleeping ? 'sleeping' : ''} ${noReview ? 'no-reviewers' : ''} ${stale ? 'stale' : ''} ${ciFailing ? 'ci-failing' : ''}"
                  data-key="${key}" onclick="handleRowClick('${key}', event)">
                <input type="checkbox" class="pr-checkbox"
                  ${selected.has(key) ? 'checked' : ''}
                  onclick="handleCheckboxClick('${key}', event)">
                ${prIcon(pr.isDraft)}
                <div class="pr-body">
                  <div class="pr-title-row">
                    <a class="pr-title" href="${pr.url}" target="_blank">${escapeHtml(pr.title)}</a>
                    <span class="pr-number">#${pr.number}</span>
                    ${ciFailing ? '<span class="ci-fail-badge">&#9888; CI failing</span>' : ''}
                    ${stale ? `<span class="stale-badge">Stale &middot; ${workdaysSinceActivity(pr)} workday${workdaysSinceActivity(pr) === 1 ? '' : 's'}</span>` : ''}
                    ${noReviewers(pr) ? '<span class="no-reviewers-badge">&#128100; No reviewers</span>' : ''}
                    ${pr.isDraft ? '<span class="draft-badge">Draft</span>' : ''}
                    ${pr.reviewDecision === 'CHANGES_REQUESTED' ? '<span class="changes-requested-badge">Changes requested</span>' : ''}
                    ${pr.reviewDecision === 'APPROVED' ? '<span class="approved-badge">Approved</span>' : ''}
                    ${sleeping ? `<span class="sleep-badge">Sleeping ${sleepRemaining(pr)}</span>` : ''}
                    ${isSleepSection ? `<button class="wake-btn" onclick="event.stopPropagation(); wakePR('${key}')">Wake</button>` : ''}
                    ${pr.labels.map(l => `<span class="label" style="${getLabelStyle(l)}">${escapeHtml(l.name)}</span>`).join('')}
                  </div>
                  <div class="pr-meta">
                    Updated ${timeAgo(pr.updatedAt)} &middot; Created ${timeAgo(pr.createdAt)}
                  </div>
                </div>
              </li>`;
            }).join('')}
          </ul>
        </div>`;
    }

    function render() {
      // Separate awake vs sleeping
      const awakePRs = allPRs.filter(pr => !isSleeping(pr));
      const sleepingPRs = allPRs.filter(pr => isSleeping(pr));

      // Filter drafts in awake list
      const filtered = showDrafts ? awakePRs : awakePRs.filter(pr => !pr.isDraft);

      // Published PRs with failing CI are the most urgent, then stale ones,
      // then requested changes, so actionable follow-ups stay at the top.
      function prSortPriority(pr) {
        if (needsAttention(pr)) return 5;
        if (isStale(pr)) return 4;
        if (pr.reviewDecision === "CHANGES_REQUESTED") return 3;
        if (pr.reviewDecision === "APPROVED") return 2;
        if (!pr.isDraft) return 1;
        return 0;
      }

      const sorted = [...filtered].sort((a, b) => {
        const pa = prSortPriority(a);
        const pb = prSortPriority(b);
        if (pa !== pb) return pb - pa;
        const da = new Date(a.updatedAt);
        const db = new Date(b.updatedAt);
        return oldestFirst ? da - db : db - da;
      });

      // Group by repo
      const groups = new Map();
      for (const pr of sorted) {
        const repo = pr.repository.nameWithOwner;
        if (!groups.has(repo)) groups.set(repo, []);
        groups.get(repo).push(pr);
      }

      function groupSortPriority(prs) {
        if (prs.some(needsAttention)) return 5;
        if (prs.some(isStale)) return 4;
        if (prs.some(pr => pr.reviewDecision === "CHANGES_REQUESTED")) return 3;
        if (prs.some(pr => pr.reviewDecision === "APPROVED")) return 2;
        if (prs.some(pr => !pr.isDraft)) return 1;
        return 0;
      }

      const sortedGroups = [...groups.entries()].sort((a, b) => {
        const pa = groupSortPriority(a[1]);
        const pb = groupSortPriority(b[1]);
        if (pa !== pb) return pb - pa;
        const aDate = new Date(a[1][0].updatedAt);
        const bDate = new Date(b[1][0].updatedAt);
        return oldestFirst ? aDate - bDate : bDate - aDate;
      });

      // Build flat key list for shift-select
      renderedKeys = [];
      for (const [, prs] of sortedGroups) {
        for (const pr of prs) renderedKeys.push(prKey(pr));
      }

      // Sleeping group
      const sleepGroups = new Map();
      for (const pr of sleepingPRs) {
        const repo = pr.repository.nameWithOwner;
        if (!sleepGroups.has(repo)) sleepGroups.set(repo, []);
        sleepGroups.get(repo).push(pr);
      }

      if (showSleeping) {
        for (const [, prs] of sleepGroups) {
          for (const pr of prs) renderedKeys.push(prKey(pr));
        }
      }

      // Stats
      const draftCount = awakePRs.filter(pr => pr.isDraft).length;
      const nonDraftCount = awakePRs.length - draftCount;
      stats.textContent = `${filtered.length} PRs (${nonDraftCount} active, ${draftCount} draft, ${sleepingPRs.length} sleeping)`;
      updateLastRefresh();

      let html = '';

      if (pingAuthError) {
        html += `<div class="auth-banner">
          <span>&#9888; Hey you &mdash; refresh your token! PR alerts can't be sent. Run <code>jf auth</code> in your terminal, then verify.</span>
          <button class="verify-btn" id="verifyTokenBtn" onclick="verifyToken()">Verify token</button>
        </div>`;
      }

      if (refreshing) {
        html += '<div class="refresh-banner"><span class="spinner-sm"></span>Refreshing&hellip;</div>';
      }

      if (refreshError) {
        html += '<div class="refresh-error-banner">Refresh failed. Showing data from the last successful update.</div>';
      }

      const attentionCount = filtered.filter(needsAttention).length;
      if (attentionCount > 0) {
        html += `<div class="attention-banner">&#9888; ${attentionCount} published PR${attentionCount === 1 ? '' : 's'} with failing CI &mdash; needs attention</div>`;
      }

      if (sorted.length === 0 && (!showSleeping || sleepingPRs.length === 0)) {
        html += '<div class="loading">No PRs found.</div>';
      } else {
        html += sortedGroups.map(([repo, prs]) => renderGroup(repo, prs, false)).join('');
      }

      if (showSleeping && sleepingPRs.length > 0) {
        html += '<div class="section-label">Sleeping</div>';
        html += [...sleepGroups.entries()]
          .map(([repo, prs]) => renderGroup(repo, prs, true))
          .join('');
      }

      app.innerHTML = html;
    }

    function toggleGroup(header) {
      header.parentElement.classList.toggle("collapsed");
    }

    draftToggle.addEventListener("click", () => {
      showDrafts = !showDrafts;
      draftToggle.classList.toggle("active", showDrafts);
      render();
    });

    sleepToggle.addEventListener("click", () => {
      showSleeping = !showSleeping;
      sleepToggle.classList.toggle("active", showSleeping);
      render();
    });

    sortBtn.addEventListener("click", () => {
      oldestFirst = !oldestFirst;
      sortBtn.textContent = oldestFirst ? "Oldest first" : "Newest first";
      render();
    });

    refreshBtn.addEventListener("click", fetchPRs);

    sleepSelectedBtn.addEventListener("click", () => {
      if (selected.size === 0) return;
      sleepPRs([...selected], 7);
    });

    wakeSelectedBtn.addEventListener("click", () => {
      if (selected.size === 0) return;
      wakePRs([...selected]);
    });

    clearSelBtn.addEventListener("click", () => {
      selected.clear();
      updateActionBar();
      updateCheckboxes();
    });

    fetchPRs();

    // Poll regularly, and refresh when returning from another tab after enough
    // time to plausibly merge or close a PR there.
    setInterval(fetchPRs, AUTO_REFRESH_MS);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" &&
          (!lastRefreshed || Date.now() - lastRefreshed >= 60 * 1000)) {
        fetchPRs();
      }
    });

    // Keep the "Updated Xm ago" label current between refreshes.
    setInterval(updateLastRefresh, 30 * 1000);
</script>
</body>
</html>
